
name: CI - Agenda de Tatuagens

on:
  push:
    branches: [main, review/auto-revisao-mvp]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Executar testes e cobertura
        run: npx ng test --watch=false --coverage
